name: RSS a Discord

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      prueba:
        description: "Modo prueba: enviar el artículo más reciente de cada feed"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: rss
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Publicar artículos nuevos
        run: python feed_to_discord.py
        env:
          TEST_MODE: ${{ inputs.prueba && '1' || '0' }}
          WEBHOOK_GUARDIAN: ${{ secrets.WEBHOOK_GUARDIAN }}
          WEBHOOK_LAREPUBLICA: ${{ secrets.WEBHOOK_LAREPUBLICA }}
          WEBHOOK_ELCATO: ${{ secrets.WEBHOOK_ELCATO }}
          WEBHOOK_LETRASLIBRES: ${{ secrets.WEBHOOK_LETRASLIBRES }}
          WEBHOOK_CEROSETENTA: ${{ secrets.WEBHOOK_CEROSETENTA }}
          
          
      - name: Guardar estado
        run: |
          git config user.name "rss-bot"
          git config user.email "rss-bot@users.noreply.github.com"
          git add seen.json
          git diff --staged --quiet || (git commit -m "Actualizar seen.json" && git push)
